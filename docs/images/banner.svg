<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="gateway-server: single entry point of the salon booking system">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>

  <!-- icon -->
  <g transform="translate(60 40) scale(0.86)">
    <rect width="256" height="256" rx="56" fill="#0b1229" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <path d="M30 128 H78" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round"/>
    <path d="M66 114 L80 128 L66 142" fill="none" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M86 196 V112 a42 42 0 0 1 84 0 V196" fill="none" stroke="url(#gate)" stroke-width="14" stroke-linecap="round"/>
    <path d="M128 98 l22 8 v18 c0 16 -10 26 -22 31 c-12 -5 -22 -15 -22 -31 v-18 z" fill="#93c5fd"/>
    <path d="M119 125 l7 7 l13 -14" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M178 128 C196 128 198 84 222 84" fill="none" stroke="#34d399" stroke-width="9" stroke-linecap="round"/>
    <path d="M178 128 H222" stroke="#34d399" stroke-width="9" stroke-linecap="round"/>
    <path d="M178 128 C196 128 198 172 222 172" fill="none" stroke="#34d399" stroke-width="9" stroke-linecap="round"/>
    <circle cx="226" cy="84" r="9" fill="#34d399"/>
    <circle cx="226" cy="128" r="9" fill="#34d399"/>
    <circle cx="226" cy="172" r="9" fill="#34d399"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="340" y="112" fill="#93c5fd" font-size="20" font-weight="600" letter-spacing="3">SALON BOOKING SYSTEM</text>
    <text x="338" y="170" fill="#ffffff" font-size="60" font-weight="700">gateway-server</text>
    <text x="340" y="212" fill="#cbd5e1" font-size="22">Verifies Keycloak JWTs and routes every request to the right service.</text>
  </g>

  <!-- chips -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="340" y="234" width="104" height="32" rx="16" fill="#1d4ed8" fill-opacity="0.45" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="392" y="255" fill="#dbeafe" text-anchor="middle">:5002</text>
    <rect x="454" y="234" width="186" height="32" rx="16" fill="#065f46" fill-opacity="0.5" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="547" y="255" fill="#d1fae5" text-anchor="middle">JWT security</text>
    <rect x="650" y="234" width="186" height="32" rx="16" fill="#065f46" fill-opacity="0.5" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="743" y="255" fill="#d1fae5" text-anchor="middle">Eureka routing</text>
    <rect x="846" y="234" width="186" height="32" rx="16" fill="#334155" fill-opacity="0.6" stroke="#94a3b8" stroke-opacity="0.6"/>
    <text x="939" y="255" fill="#e2e8f0" text-anchor="middle">8 services behind</text>
  </g>
</svg>
