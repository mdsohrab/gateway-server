<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="gateway-server icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- incoming request -->
  <path d="M30 128 H78" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round"/>
  <path d="M66 114 L80 128 L66 142" fill="none" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the gate: arch with a shield (security) inside -->
  <path d="M86 196 V112 a42 42 0 0 1 84 0 V196" fill="none" stroke="url(#gate)" stroke-width="14" stroke-linecap="round"/>
  <path d="M128 98 l22 8 v18 c0 16 -10 26 -22 31 c-12 -5 -22 -15 -22 -31 v-18 z" fill="#93c5fd"/>
  <path d="M119 125 l7 7 l13 -14" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- routing out to services -->
  <path d="M178 128 C196 128 198 84 222 84" fill="none" stroke="#34d399" stroke-width="9" stroke-linecap="round"/>
  <path d="M178 128 H222" stroke="#34d399" stroke-width="9" stroke-linecap="round"/>
  <path d="M178 128 C196 128 198 172 222 172" fill="none" stroke="#34d399" stroke-width="9" stroke-linecap="round"/>
  <circle cx="226" cy="84" r="9" fill="#34d399"/>
  <circle cx="226" cy="128" r="9" fill="#34d399"/>
  <circle cx="226" cy="172" r="9" fill="#34d399"/>
</svg>
